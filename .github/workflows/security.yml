# Bagimlilik guvenlik taramasi (pip-audit, bilinen acik veritabani). Yalnizca RAPOR eder; surumleri degistirmez.
# Kutuphane surumleri canli protokoller boyunca sabit kalmalidir: bir guncelleme hesaplari degistirebilir.
# Acik bulunursa guncelleme ayrica degerlendirilir (gerekirse yeni protokol kimligiyle).
name: security

on:
  push:
    branches: [main]
    paths:
      - "requirements.txt"
      - ".github/workflows/security.yml"
  schedule:
    - cron: "41 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pip-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd   # v5.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c   # v6.0.0
        with:
          python-version: "3.11"
      - name: pip-audit
        run: |
          python -m pip install pip-audit==2.9.0
          pip-audit -r requirements.txt --desc
