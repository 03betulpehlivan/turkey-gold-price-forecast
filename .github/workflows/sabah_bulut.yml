# Ileriye donuk karne kaydinin bulutta alinmasi: bilgisayar kapali olsa da her is gunu calisir.
# - TCMB EVDS'den guncel fiziki gram altin serisini indirir (2018 sonrasi; modeller son 750 gunu kullanir).
# - 1, 3 ve 5 gunluk araliklari kaydeder. Kayit kurallari koddadir: ertesi is gunu 14:00 (Istanbul) oncesi,
#   ayni gun icin tek kayit. Veri henuz yayimlanmadiysa kayit yapilmaz ve hata sayilmaz; sonraki deneme alir.
# - Chronos modeli bir kez indirilir ve onbellekte tutulur; sonraki gunlerde Hugging Face'e baglanilmaz.
# - Yalnizca research/tool/canli_aralik_log.csv dosyasini commit eder.
# - Herkese acik siteyi (src/tool/site.py) uretir ve GitHub Pages'e yayimlar (ayri is, yalnizca Pages yetkisi).
# Bu depoda gizli anahtar kullanan ve depoya yazan TEK gorev budur (tests/test_repo_hygiene.py denetler).
# Yalnizca zamanlayici ve elle baslatma ile calisir; pull request ile tetiklenmez.
# Son denemede (13:05) bekci: is gununde onceki islem gununun kaydi yoksa gorev basarisiz olur, GitHub e-posta atar.
name: sabah-bulut

on:
  schedule:
    - cron: "5 7 * * 1-5"     # 10:05 Istanbul
    - cron: "35 8 * * 1-5"    # 11:35 Istanbul
    - cron: "5 10 * * 1-5"    # 13:05 Istanbul
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sabah-bulut
  cancel-in-progress: false

jobs:
  karne:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    outputs:
      site: ${{ steps.site_hazir.outputs.hazir }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0   # v7.1.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-chronos.txt
      - name: Bagimliliklar
        run: |
          python -m pip install -r requirements.txt
          python -m pip install -r requirements-chronos.txt
      - name: Guncel fiyat (TCMB EVDS)
        env:
          EVDS_API_KEY: ${{ secrets.EVDS_API_KEY }}
          PYTHONIOENCODING: utf-8
        run: python -m src.tool.bulut_veri
      - name: Chronos modeli (onbellek)
        id: hf
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9   # v6.1.0
        with:
          path: ~/.cache/huggingface
          key: hf-amazon-chronos-bolt-small-v1
      - name: Karne kaydi (1, 3 ve 5 gun)
        env:
          PYTHONIOENCODING: utf-8
          HF_HUB_OFFLINE: ${{ steps.hf.outputs.cache-hit == 'true' && '1' || '0' }}   # onbellekte varsa internete cikma
        run: python -m src.tool.canli_karne kaydet --chronos-zorunlu --gec-uyari
      - name: Kaydi gonder
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          f=research/tool/canli_aralik_log.csv
          if git diff --quiet -- "$f"; then echo "Yeni kayit yok."; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- "$f"
          git commit -q -m "Ileriye donuk karne (bulut): 1/3/5 gun araliklari" -- "$f"
          url="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          for n in 1 2 3; do
            if git pull -q --rebase "$url" main && git push -q "$url" HEAD:main; then echo "Kayit gonderildi."; exit 0; fi
            sleep 10
          done
          echo "HATA: kayit gonderilemedi."
          exit 1
      - name: Site (GitHub Pages)
        env:
          PYTHONIOENCODING: utf-8
          HF_HUB_OFFLINE: ${{ steps.hf.outputs.cache-hit == 'true' && '1' || '0' }}
        run: python -m src.tool.site
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9   # v5.0.0
        with:
          path: _site
      - name: Site hazir
        id: site_hazir
        run: echo "hazir=evet" >> "$GITHUB_OUTPUT"
      - name: Bekci (son deneme; is gununde kayit yoksa basarisiz ve e-posta)
        if: github.event.schedule == '5 10 * * 1-5'
        env:
          PYTHONIOENCODING: utf-8
        run: python -m src.tool.canli_karne denetle

  yayin:
    # Siteyi GitHub Pages'e yayimlar. Bekci alarm verse de site guncellenir (site, bekciden once paketlenir).
    # Yalnizca Pages yetkisi vardir; depoya yazamaz, gizli anahtar kullanmaz.
    needs: karne
    if: always() && needs.karne.outputs.site == 'evet'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.dagit.outputs.page_url }}
    steps:
      - id: dagit
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346   # v5.0.1
