# Birim testleri (sentetik veri; gercek veri, API anahtari veya ag erisimi gerekmez).
# Gunluk canli kayit commit'leri (research/live/) ve yalnizca belge degisiklikleri testi tetiklemez.
name: tests

on:
  push:
    branches: [main]
    paths-ignore:
      - "research/live/**"
      - "docs/**"
      - "**/*.md"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unittest:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Bagimliliklar
        run: python -m pip install -r requirements.txt
      - name: Testler
        run: python -m unittest discover -s tests
