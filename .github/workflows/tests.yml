# Birim testleri (sentetik veri; gercek veri, API anahtari veya ag erisimi gerekmez).
# Gunluk canli kayit commit'leri (research/live/) ve yalnizca belge degisiklikleri testi tetiklemez.
name: tests

on:
  push:
    branches: [main]
    paths-ignore:
      - "research/live/**"
      - "docs/**"
      - "**/*.md"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unittest:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd   # v5.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c   # v6.0.0
        with:
          python-version: "3.11"
          cache: pip
      - name: Bagimliliklar
        run: python -m pip install -r requirements.txt
      - name: Testler
        run: python -m unittest discover -s tests
